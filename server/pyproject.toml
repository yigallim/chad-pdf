[project]
name = "chad-pdf"
version = "0.0.1"
description = "Chat with PDFs using LLMs - BMCS2123 NLP Assignment"
requires-python = "==3.12.9"

dependencies = [
    "flask",
    "flask_pymongo",
    "flask_cors",
    "PyMuPDF",
    "spacy",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "langchain==0.3.27",
    "scikit-learn",
    "openai",
    "python-dotenv",
    "gTTS",
    "beautifulsoup4",
    "mistune",
    "chromadb",
    "sentence-transformers",
    "langchain-huggingface",
    "redis>=7.1.0",
]

[build-system]
requires = ["setuptools>=78.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
